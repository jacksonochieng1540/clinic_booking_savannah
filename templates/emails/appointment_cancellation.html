<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #f44336; color: white; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { padding: 30px; background: #f9f9f9; }
        .info { background: #ffebee; padding: 15px; border-radius: 5px; margin: 15px 0; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Appointment Cancelled</h1>
        </div>
        <div class="content">
            <h2>Hello {{ patient_name }},</h2>
            <p>Your appointment has been <strong>cancelled</strong>.</p>

            <div class="info">
                <p><strong> Doctor:</strong> {{ doctor_name }}</p>
                <p><strong> Date:</strong> {{ date }}</p>
                <p><strong> Time:</strong> {{ time }}</p>
                <p><strong> Reason:</strong> {{ reason }}</p>
            </div>

            <p>You can book a new appointment at any time.</p>
        </div>
        <div class="footer">
            <p>&copy; {% now "Y" %} Clinic Booking System</p>
        </div>
    </div>
</body>
</html>
