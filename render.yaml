services:
  - type: web
    name: clinic-booking
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py shell -c "from accounts.models import User; import os; email=os.getenv('ADMIN_EMAIL'); password=os.getenv('ADMIN_PASSWORD'); User.objects.create_superuser(email, 'venv', password) if email and password and not User.objects.filter(email=email).exists() else None"
    startCommand: |
      gunicorn clinic_booking.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: clinic-booking.onrender.com,localhost,127.0.0.1
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: clinic-db
    plan: free
